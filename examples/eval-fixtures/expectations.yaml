# Declared expectations for the evaluation fixtures.
#
# This file is the single source of truth for what each fixture *should*
# provoke.  The campaign harness compares observed gate behaviour against these
# declarations; a mismatch is reported as a conformance failure, never
# reconciled by relabelling the fixture.
#
# expect_decision is a property of the fixture alone (it depends only on the
# code being scanned).  The expected terminal *status* additionally depends on
# the run conditions, so it is declared per scenario in scenarios.yaml.

fixtures:
  # ---------------------------------------------------------------- ansible --
  - id: ans-pass
    branch: ansible
    path: examples/eval-fixtures/ansible/pass
    band: pass
    expect_decision: pass
    rationale: >-
      Clean playbook: fully-qualified modules, named tasks, restrictive file
      modes, no embedded credentials.  Establishes that the gate does not
      block compliant on-prem change.

  - id: ans-review
    branch: ansible
    path: examples/eval-fixtures/ansible/review
    band: review
    expect_decision: review
    rationale: >-
      Moderate weaknesses: a plaintext service password, a world-readable
      config file carrying it, and TLS validation disabled on an artifact
      download.  Should require human adjudication, not auto-rejection.

  - id: ans-reject
    branch: ansible
    path: examples/eval-fixtures/ansible/reject
    band: reject
    expect_decision: reject
    rationale: >-
      Severe, compounding weaknesses: hardcoded cloud credentials and private
      key material, remote script piped to a shell, world-writable secret
      files, and unrestricted passwordless sudo.

  # -------------------------------------------------------------------- cdk --
  - id: cdk-pass
    branch: cdk
    path: examples/eval-fixtures/cdk/pass
    band: pass
    expect_decision: pass
    rationale: >-
      Encrypted, private, logged storage with least-privilege access and no
      public ingress.

  - id: cdk-review
    branch: cdk
    path: examples/eval-fixtures/cdk/review
    band: review
    expect_decision: review
    rationale: >-
      Moderate weaknesses: missing access logging and versioning, an
      over-broad but non-public security-group rule.

  - id: cdk-reject
    branch: cdk
    path: examples/eval-fixtures/cdk/reject
    band: reject
    expect_decision: reject
    rationale: >-
      Severe weaknesses: SSH open to the internet, unencrypted public
      storage, and a wildcard IAM policy.

  - id: cdk-mlrisk
    branch: cdk
    path: examples/eval-fixtures/cdk/mlrisk
    band: reject
    expect_decision: reject
    rationale: >-
      Storage, logging, network and function configuration hardened to the same
      standard as cdk-pass.  One template weakness — a wildcard IAM policy —
      is calibrated to leave the stack inside the review band on its own, and a
      second weakness sits where no template scanner reaches: certificate
      validation disabled in a Lambda handler bundled from source.  Added after
      the learned component was rescaled, because every other CDK fixture
      contains only resource declarations and the component can act only on
      Python, so no fixture in the set exercised it.  Measured at 115 points, of
      which 45 come from the learned component and 70 from the template
      findings, so the learned component is what carries the stack across the
      reject threshold.

  # ----------------------------------------------------------------- parity --
  #
  # Each parity pair encodes *one* weakness class on both sides of the hybrid
  # boundary: once as cloud infrastructure-as-code and once as on-premises
  # configuration.  Everything else in each fixture is deliberately
  # unremarkable, so a difference in verdict is attributable to the boundary
  # rather than to incidental differences in the surrounding code.
  #
  # The RQ2 claim under test is agreement: the same weakness should land in the
  # same band on both sides.  The band recorded below is therefore *descriptive*
  # — it is the value measured during calibration, not a target that the fixture
  # was tuned to hit.  Pairs that disagree are reported as parity gaps; the
  # plaintext-secret pair is expected to disagree, because the cloud path runs
  # no secret scanner at all.

  - id: par-open-ingress-cdk
    branch: cdk
    path: examples/eval-fixtures/parity/open-ingress/cdk
    parity_pair: open-ingress
    weakness_class: exposure-wrong-sphere
    band: review
    expect_decision: review
    rationale: >-
      Security group permitting SSH from 0.0.0.0/0.  Measured at 24 points: the
      gate's own resource heuristic raises this as critical.

  - id: par-open-ingress-ansible
    branch: ansible
    path: examples/eval-fixtures/parity/open-ingress/ansible
    parity_pair: open-ingress
    weakness_class: exposure-wrong-sphere
    band: pass
    expect_decision: pass
    rationale: >-
      Host firewall rule permitting SSH from 0.0.0.0/0, expressed with
      ansible.builtin.iptables.  Measured at 20 points from the semantic
      ingress rule, which is exactly the pass ceiling, so the decision stays
      pass while the paired cloud fixture reaches review at 24.  Before the
      semantic rules existed this fixture measured 0.

  - id: par-plaintext-secret-cdk
    branch: cdk
    path: examples/eval-fixtures/parity/plaintext-secret/cdk
    parity_pair: plaintext-secret
    weakness_class: insecure-secret-storage
    band: review
    expect_decision: review
    rationale: >-
      Credential baked into a function's environment in clear text.  Measured at
      63 points, of which 38 come from the learned code-risk model rather than
      from a secret scanner — the cloud path has no secret scanner, so detection
      here is incidental to the ML component.

  - id: par-plaintext-secret-ansible
    branch: ansible
    path: examples/eval-fixtures/parity/plaintext-secret/ansible
    parity_pair: plaintext-secret
    weakness_class: insecure-secret-storage
    band: pass
    expect_decision: pass
    rationale: >-
      Credential committed to a variable file in clear text.  Measured at 20
      points from the regex secret scan — detected, but exactly at the pass
      ceiling, so it is auto-passed rather than adjudicated.

  - id: par-overprivileged-access-cdk
    branch: cdk
    path: examples/eval-fixtures/parity/overprivileged-access/cdk
    parity_pair: overprivileged-access
    weakness_class: improper-privilege-management
    band: review
    expect_decision: review
    rationale: >-
      IAM policy granting Action "*" on Resource "*".  Measured at 59 points
      from the wildcard heuristic plus seven Checkov findings.

  - id: par-overprivileged-access-ansible
    branch: ansible
    path: examples/eval-fixtures/parity/overprivileged-access/ansible
    parity_pair: overprivileged-access
    weakness_class: improper-privilege-management
    band: review
    expect_decision: review
    rationale: >-
      Passwordless unrestricted sudo and a world-writable directory.  Measured
      at 30 points: the semantic rules raise NOPASSWD:ALL as critical and mode
      0777 as high.  Before those rules existed this fixture measured 0.

  - id: par-unencrypted-storage-cdk
    branch: cdk
    path: examples/eval-fixtures/parity/unencrypted-storage/cdk
    parity_pair: unencrypted-storage
    weakness_class: missing-encryption
    band: review
    expect_decision: review
    rationale: >-
      Object and block storage created without encryption at rest.  Measured at
      34 points from the encryption heuristics plus three Checkov findings.

  - id: par-unencrypted-storage-ansible
    branch: ansible
    path: examples/eval-fixtures/parity/unencrypted-storage/ansible
    parity_pair: unencrypted-storage
    weakness_class: missing-encryption
    band: review
    expect_decision: review
    rationale: >-
      Data filesystem created and mounted with no encryption layer.  Measured
      at 25 points: a style rule (10), an unencrypted filesystem creation (10)
      and an unencrypted persistent mount (5).  Before the semantic rules
      existed this fixture measured 10, entirely from the style rule.

  # --------------------------------------------------------------- coverage --
  #
  # The seven pairs below extend the parity set to the remaining weakness
  # classes in evaluation/coverage_catalogue.yaml, which are derived from MITRE
  # CWE-1008 rather than chosen by the author.  They exist to measure detection
  # coverage, so their declared bands are of secondary interest: what matters is
  # whether either branch emits a finding that names the class.
  #
  # Each band below is the value observed when the fixture was first scored
  # against the gate at commit 6e092b9, before any detection rule was written in
  # response to it.  Several sit at pass with a score of zero.  That is the
  # measurement, not a defect in the fixture: a weakness no scanner names
  # contributes nothing to the score, which is precisely the finding the
  # coverage table reports.
  #
  # The bands are therefore a record of the baseline arm and are deliberately
  # left unchanged.  In the remediated arm the rules listed under `remediation`
  # in evaluation/coverage_catalogue.yaml name several of these weaknesses for
  # the first time, so the fixtures score higher and the campaign reports them
  # as non-conformant against these bands.  That divergence is the effect being
  # measured; updating the bands to match would erase it.

  - id: cov-control-cdk
    branch: cdk
    path: examples/eval-fixtures/parity/control/cdk
    band: pass
    expect_decision: pass
    rationale: >-
      Specificity control for the cloud branch: a stack carrying none of the
      catalogued weaknesses, so that a matcher firing here would show it is
      responding to something other than the weakness.  Measured at 4 points
      with no findings.  It avoids S3 deliberately -- cdk-pass was the original
      control and had to be replaced, because a bucket receiving access logs
      cannot log to itself and carries a log-delivery ACL, which made two
      matchers fire on the control for reasons unconnected to the weakness.

  - id: cov-control-ansible
    branch: ansible
    path: examples/eval-fixtures/parity/control/ansible
    band: pass
    expect_decision: pass
    rationale: >-
      Specificity control for the on-premises branch.  Touches the same subject
      matter as the weakness fixtures -- service account, unit file,
      configuration directory, downloaded artifact -- so a matcher keying on
      vocabulary rather than on the defect would be caught.  Measured at 0
      points with no findings.

  - id: par-insufficient-logging-cdk
    branch: cdk
    path: examples/eval-fixtures/parity/insufficient-logging/cdk
    parity_pair: insufficient-logging
    weakness_class: insufficient-logging
    band: pass
    expect_decision: pass
    rationale: >-
      Object storage with no access-log destination and no trail over
      control-plane activity.  Measured at 9 points from a single Checkov
      finding (CKV_AWS_18) naming the missing access log.

  - id: par-insufficient-logging-ansible
    branch: ansible
    path: examples/eval-fixtures/parity/insufficient-logging/ansible
    parity_pair: insufficient-logging
    weakness_class: insufficient-logging
    band: pass
    expect_decision: pass
    rationale: >-
      Audit daemon masked and security logs excluded from rotation.  Measured at
      0 points: no scanner on the on-premises path examines logging or audit
      configuration.

  - id: par-missing-authentication-cdk
    branch: cdk
    path: examples/eval-fixtures/parity/missing-authentication/cdk
    parity_pair: missing-authentication
    weakness_class: missing-authentication
    band: review
    expect_decision: review
    rationale: >-
      A credential-rotation method exposed with its authorizer set to none.
      Measured at 24 points from four Checkov findings, none of which names the
      absent authorizer -- three concern stage logging, caching and tracing,
      and the fourth concerns back-end access.

  - id: par-missing-authentication-ansible
    branch: ansible
    path: examples/eval-fixtures/parity/missing-authentication/ansible
    parity_pair: missing-authentication
    weakness_class: missing-authentication
    band: pass
    expect_decision: pass
    rationale: >-
      SSH daemon configured to accept empty passwords and direct root login.
      Measured at 0 points: no scanner on the on-premises path reads sshd
      configuration.

  - id: par-incorrect-permissions-cdk
    branch: cdk
    path: examples/eval-fixtures/parity/incorrect-permissions/cdk
    parity_pair: incorrect-permissions
    weakness_class: incorrect-permissions
    band: pass
    expect_decision: pass
    rationale: >-
      A key policy usable by any principal without condition.  Measured at 9
      points from one Checkov finding (CKV_AWS_33).

  - id: par-incorrect-permissions-ansible
    branch: ansible
    path: examples/eval-fixtures/parity/incorrect-permissions/ansible
    parity_pair: incorrect-permissions
    weakness_class: incorrect-permissions
    band: pass
    expect_decision: pass
    rationale: >-
      Service configuration directory and file created world-writable.
      Measured at 20 points from two semantic file-mode findings, which is
      exactly the pass ceiling.

  - id: par-externally-accessible-files-cdk
    branch: cdk
    path: examples/eval-fixtures/parity/externally-accessible-files/cdk
    parity_pair: externally-accessible-files
    weakness_class: externally-accessible-files
    band: review
    expect_decision: review
    rationale: >-
      A document store with public read access and every public-access guard
      switched off.  Measured at 24 points, led by the gate's own
      public-access-block heuristic.

  - id: par-externally-accessible-files-ansible
    branch: ansible
    path: examples/eval-fixtures/parity/externally-accessible-files/ansible
    parity_pair: externally-accessible-files
    weakness_class: externally-accessible-files
    band: pass
    expect_decision: pass
    rationale: >-
      A data directory exported over NFS to every host that can route to it.
      Measured at 0 points: no scanner on the on-premises path reads export
      tables.

  - id: par-unbounded-resources-cdk
    branch: cdk
    path: examples/eval-fixtures/parity/unbounded-resources/cdk
    parity_pair: unbounded-resources
    weakness_class: unbounded-resources
    band: review
    expect_decision: review
    rationale: >-
      A function with no reserved concurrency behind an unthrottled API stage.
      Measured at 44 points from eight findings, one of which
      (lambda_concurrency) names the missing limit.

  - id: par-unbounded-resources-ansible
    branch: ansible
    path: examples/eval-fixtures/parity/unbounded-resources/ansible
    parity_pair: unbounded-resources
    weakness_class: unbounded-resources
    band: pass
    expect_decision: pass
    rationale: >-
      A service unit and a limits file that remove every file-descriptor,
      process, task and memory ceiling.  Measured at 0 points: no scanner on the
      on-premises path reads unit or limits files.

  - id: par-cleartext-transmission-cdk
    branch: cdk
    path: examples/eval-fixtures/parity/cleartext-transmission/cdk
    parity_pair: cleartext-transmission
    weakness_class: cleartext-transmission
    band: review
    expect_decision: review
    rationale: >-
      A load balancer listener serving the application over plaintext HTTP.
      Measured at 24 points from four Checkov findings, two of which name the
      transport directly.

  - id: par-cleartext-transmission-ansible
    branch: ansible
    path: examples/eval-fixtures/parity/cleartext-transmission/ansible
    parity_pair: cleartext-transmission
    weakness_class: cleartext-transmission
    band: pass
    expect_decision: pass
    rationale: >-
      A release fetched over HTTP with certificate validation disabled, and a
      database connection configured without TLS.  Measured at 10 points from
      two Checkov findings about the download; the unprotected database
      connection produces no finding at all.

  - id: par-unnecessary-privileges-cdk
    branch: cdk
    path: examples/eval-fixtures/parity/unnecessary-privileges/cdk
    parity_pair: unnecessary-privileges
    weakness_class: unnecessary-privileges
    band: pass
    expect_decision: pass
    rationale: >-
      A container definition running privileged and as root.  Measured at 9
      points from one finding about cluster insights; nothing in the report
      concerns the privilege the container is given.

  - id: par-unnecessary-privileges-ansible
    branch: ansible
    path: examples/eval-fixtures/parity/unnecessary-privileges/ansible
    parity_pair: unnecessary-privileges
    weakness_class: unnecessary-privileges
    band: pass
    expect_decision: pass
    rationale: >-
      A service unit running as root with an ambient administrative capability.
      Measured at 20 points, but from the sudoers entry rather than from the
      unit: the semantic rule names unrestricted escalation, not the privilege
      the service itself holds.
