# On-prem database inventory for the hybrid web-app demo.
#
# Replace ansible_host with the Tailscale IP (100.x) or LAN address of the
# machine that will run PostgreSQL. This host also acts as the Tailscale
# subnet router that advertises the DB subnet to your tailnet.
[dbservers]
onprem-db ansible_host=100.112.100.124 ansible_user=ubuntu
