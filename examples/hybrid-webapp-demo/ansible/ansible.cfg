# Ansible settings for the hybrid web-app demo.
#
# The on-prem database is typically an ephemeral VM (multipass/VirtualBox)
# reached over Tailscale, so its SSH host key changes between rebuilds and is
# not worth pinning for a demo. Disabling host-key checking also avoids the
# "Host key verification failed" / ssh-askpass error when running from a
# non-interactive shell.
[defaults]
inventory = inventory.ini
host_key_checking = False

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null -o ControlMaster=auto -o ControlPersist=60s
